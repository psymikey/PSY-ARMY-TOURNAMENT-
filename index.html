<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSY ARMY Tournament</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #050505;
      color: white;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 500px;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 32px;
      color: #ff2020;
      text-shadow: 0 0 15px #ff0000;
    }

    .header p {
      margin-top: 8px;
      color: #aaa;
    }

    .card {
      background: #111;
      border: 1px solid #ff2020;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 0 25px rgba(255, 0, 0, 0.25);
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #050505;
      color: white;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #ff2020;
      box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #ff2020;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 0, 0, 0.5);
    }

    button:active {
      transform: scale(0.98);
    }

    .note {
      text-align: center;
      margin-top: 18px;
      color: #777;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>⚡ PSY ARMY ⚡</h1>
      <p>TOURNAMENT REGISTRATION</p>
    </div>

    <div class="card">

      <form id="tournamentForm">

        <label>Team Name</label>
        <input type="text" id="team" placeholder="Enter team name" required>

        <label>Captain Name</label>
        <input type="text" id="captain" placeholder="Enter captain name" required>

        <label>Game UID</label>
        <input type="text" id="uid" placeholder="Enter game UID" required>

        <label>WhatsApp Number</label>
        <input type="tel" id="phone" placeholder="Enter WhatsApp number" required>

        <label>Game</label>
        <select id="game" required>
          <option value="">Select Game</option>
          <option value="Free Fire">Free Fire</option>
          <option value="Free Fire MAX">Free Fire MAX</option>
        </select>

        <button type="submit">🔥 APPLY NOW</button>

      </form>

      <div class="note">
        PSY ARMY Tournament • Registration
      </div>

    </div>
  </div>

  <script>
document.getElementById("tournamentForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const button = this.querySelector("button");
  button.disabled = true;
  button.textContent = "⏳ SUBMITTING...";

  const data = {
    team: document.getElementById("team").value,
    captain: document.getElementById("captain").value,
    uid: document.getElementById("uid").value,
    phone: document.getElementById("phone").value,
    game: document.getElementById("game").value
  };

  try {
    const response = await fetch(
      "https://psy-tournament.sa9043108714.workers.dev",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      }
    );

    const result = await response.json();

    if (result.success) {
      alert("✅ APPLICATION SUBMITTED SUCCESSFULLY! 🔥");
      this.reset();
    } else {
      alert("❌ Application failed. Please try again.");
    }

  } catch (error) {
    alert("❌ Something went wrong. Please try again.");
  }

  button.disabled = false;
  button.textContent = "🔥 APPLY NOW";
});
  </script>

</body>
</html>
